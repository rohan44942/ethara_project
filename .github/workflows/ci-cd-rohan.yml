name: CI/CD (ROHAN)

on:
  push:
    branches: [ "ROHAN" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ${{ github.repository }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}/backend:rohan-${{ github.sha }}
      FRONTEND_IMAGE: ${{ env.IMAGE_PREFIX }}/frontend:rohan-${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ env.BACKEND_IMAGE }},${{ env.IMAGE_PREFIX }}/backend:rohan-latest

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ env.FRONTEND_IMAGE }},${{ env.IMAGE_PREFIX }}/frontend:rohan-latest

    - name: Install Node (for migrations)
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install backend deps & run migrations (CI)
      working-directory: backend
      run: |
        npm ci
        npx prisma migrate deploy --schema=prisma/schema.prisma

    - name: Trigger Render deploy (optional)
      if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
      run: |
        curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Accept: application/json" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": true}'

    # Railway deploy example (commented). To enable, add secrets RAILWAY_API_KEY and RAILWAY_PROJECT_ID and
    # uncomment the step below. Adjust CLI commands to your Railway setup.
    # - name: Railway deploy (optional)
    #   if: ${{ secrets.RAILWAY_API_KEY != '' && secrets.RAILWAY_PROJECT_ID != '' }}
    #   run: |
    #     npm i -g @railway/cli
    #     railway login --apiKey ${{ secrets.RAILWAY_API_KEY }}
    #     railway up --project ${{ secrets.RAILWAY_PROJECT_ID }} --branch ROHAN --yes
